<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="theme-color" content="#0b0f14">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4828606537360328" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ site.baseurl }}/">Simba<span>World</span></a>
      <nav class="nav-links">
        <a href="{{ site.baseurl }}/#about">About</a>
        <a href="{{ site.baseurl }}/#experience">Experience</a>
        <a href="{{ site.baseurl }}/#talks">Talks</a>
        <a href="{{ site.baseurl }}/#contributions">Open Source</a>
        <a href="{{ site.baseurl }}/#projects">Projects</a>
        <a href="{{ site.baseurl }}/#apps">Apps</a>
        <a href="{{ site.baseurl }}/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer">
      <div class="footer-copy">
        <p>&copy; {{ site.time | date: '%Y' }} Shubham Gupta · Simba World</p>
        <p class="muted">Built with Jekyll · Hosted on GitHub Pages</p>
      </div>
      <div class="footer-meta">
        <img class="counter-badge"
             src="https://hits.sh/simbaworld.org.svg?label=visits&amp;color=161922&amp;labelColor=f0b429"
             alt="Visitor counter" loading="lazy" />
      </div>
    </div>

    <!-- Small responsive ad -->
    <div class="container ad">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-4828606537360328"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </footer>
</body>
</html>
